<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skylark BI - Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; }
        .header { background: #1e293b; padding: 16px 24px; border-bottom: 1px solid #334155; display: flex; align-items: center; gap: 12px; }
        .header h1 { font-size: 20px; font-weight: 600; color: #f8fafc; }
        .header .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
        .container { flex: 1; display: flex; overflow: hidden; }
        .chat-panel { flex: 1; display: flex; flex-direction: column; }
        .messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
        .msg { max-width: 80%; padding: 14px 18px; border-radius: 12px; line-height: 1.6; font-size: 14px; }
        .msg.user { align-self: flex-end; background: #4f46e5; color: #fff; border-bottom-right-radius: 4px; }
        .msg.bot { align-self: flex-start; background: #1e293b; border: 1px solid #334155; border-bottom-left-radius: 4px; }
        .msg.bot .answer { white-space: pre-wrap; }
        .msg.bot .meta { margin-top: 8px; font-size: 12px; color: #94a3b8; }
        .msg.bot .insights { margin-top: 10px; }
        .msg.bot .insights li { margin-left: 16px; margin-bottom: 4px; }
        .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; margin-top: 16px; }
        .chart-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; }
        .chart-card h3 { font-size: 13px; color: #94a3b8; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        .chart-card canvas { max-height: 220px; }
        .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .kpi-item { background: #0f172a; border-radius: 8px; padding: 14px; text-align: center; }
        .kpi-item .value { font-size: 22px; font-weight: 700; }
        .kpi-item .label { font-size: 11px; color: #94a3b8; margin-top: 4px; text-transform: uppercase; }
        .input-bar { padding: 16px 24px; background: #1e293b; border-top: 1px solid #334155; display: flex; gap: 12px; }
        .input-bar input { flex: 1; padding: 12px 16px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 14px; outline: none; }
        .input-bar input:focus { border-color: #4f46e5; }
        .input-bar button { padding: 12px 24px; border-radius: 8px; border: none; background: #4f46e5; color: #fff; font-size: 14px; font-weight: 500; cursor: pointer; }
        .input-bar button:hover { background: #4338ca; }
        .input-bar button:disabled { background: #334155; cursor: not-allowed; }
        .typing { display: flex; gap: 4px; padding: 14px 18px; }
        .typing span { width: 8px; height: 8px; border-radius: 50%; background: #64748b; animation: bounce 1.4s infinite; }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-8px); } }
        .welcome { text-align: center; margin-top: 20vh; color: #64748b; }
        .welcome h2 { font-size: 24px; color: #e2e8f0; margin-bottom: 8px; }
        .welcome p { font-size: 14px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="dot"></div>
        <h1>Skylark BI</h1>
    </div>
    <div class="container">
        <div class="chat-panel">
            <div class="messages" id="messages">
                <div class="welcome">
                    <h2>Skylark BI Assistant</h2>
                    <p>Ask me anything about your Monday.com data</p>
                </div>
            </div>
            <div class="input-bar">
                <input type="text" id="input" placeholder="Ask about your business data..." autofocus />
                <button id="send" onclick="send()">Send</button>
            </div>
        </div>
    </div>
    <script>
        const messages = document.getElementById('messages');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send');
        const chartInstances = [];

        input.addEventListener('keydown', e => { if (e.key === 'Enter' && !sendBtn.disabled) send(); });

        function addMessage(text, type) {
            const welcome = messages.querySelector('.welcome');
            if (welcome) welcome.remove();
            const div = document.createElement('div');
            div.className = `msg ${type}`;
            div.innerHTML = text;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
            return div;
        }

        function showTyping() {
            const div = document.createElement('div');
            div.className = 'msg bot';
            div.id = 'typing';
            div.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        }

        function removeTyping() {
            const el = document.getElementById('typing');
            if (el) el.remove();
        }

        function renderCharts(charts) {
            if (!charts || !charts.length) return '';
            let html = '<div class="charts-grid">';
            charts.forEach((chart, i) => {
                if (chart.type === 'kpi') {
                    html += `<div class="chart-card" style="grid-column: 1 / -1"><h3>${chart.title}</h3><div class="kpi-grid">`;
                    chart.data.items.forEach(item => {
                        html += `<div class="kpi-item"><div class="value" style="color:${item.color}">${item.value}</div><div class="label">${item.label}</div></div>`;
                    });
                    html += '</div></div>';
                } else {
                    html += `<div class="chart-card"><h3>${chart.title}</h3><canvas id="chart-${i}"></canvas></div>`;
                }
            });
            html += '</div>';
            return html;
        }

        function initCharts(charts) {
            if (!charts) return;
            chartInstances.forEach(c => c.destroy());
            chartInstances.length = 0;
            charts.forEach((chart, i) => {
                if (chart.type === 'kpi') return;
                const canvas = document.getElementById(`chart-${i}`);
                if (!canvas) return;
                const instance = new Chart(canvas, {
                    type: chart.type,
                    data: chart.data,
                    options: chart.options || {},
                });
                chartInstances.push(instance);
            });
        }

        async function send() {
            const msg = input.value.trim();
            if (!msg) return;
            addMessage(msg, 'user');
            input.value = '';
            sendBtn.disabled = true;
            showTyping();

            try {
                const res = await fetch('/api/v1/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg }),
                });
                const data = await res.json();
                removeTyping();

                let botHtml = `<div class="answer">${escapeHtml(data.answer || 'No answer received.')}</div>`;

                if (data.insights && data.insights.length) {
                    botHtml += '<div class="insights"><strong>Insights:</strong><ul>';
                    data.insights.forEach(i => { botHtml += `<li>${escapeHtml(i)}</li>`; });
                    botHtml += '</ul></div>';
                }
                if (data.recommendations && data.recommendations.length) {
                    botHtml += '<div class="insights"><strong>Recommendations:</strong><ul>';
                    data.recommendations.forEach(r => { botHtml += `<li>${escapeHtml(r)}</li>`; });
                    botHtml += '</ul></div>';
                }
                if (data.warnings && data.warnings.length) {
                    botHtml += '<div class="insights" style="color:#f59e0b"><strong>Warnings:</strong><ul>';
                    data.warnings.forEach(w => { botHtml += `<li>${escapeHtml(w)}</li>`; });
                    botHtml += '</ul></div>';
                }

                botHtml += `<div class="meta">Confidence: ${(data.confidence * 100).toFixed(0)}% | Time: ${data.execution_time}s</div>`;
                botHtml += renderCharts(data.charts);

                const botMsg = addMessage(botHtml, 'bot');
                initCharts(data.charts);
            } catch (err) {
                removeTyping();
                addMessage(`Error: ${err.message}`, 'bot');
            }
            sendBtn.disabled = false;
            input.focus();
        }

        function escapeHtml(text) {
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }
    </script>
</body>
</html>
